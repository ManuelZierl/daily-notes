name: Review dependency audit

on:
  push:
    branches: [fix/deep-review-data-integrity]
    paths: [.github/workflows/review-audit.yml]

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/fix/deep-review-data-integrity'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Check out the pinned Kestral package contract
        uses: actions/checkout@v6
        with:
          repository: ManuelZierl/kestral
          ref: 82a983a268911e7a1958b4c6eab06dde334070b1
          path: .kestral-contract
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - name: Resolve only the identified security updates
        run: |
          npm ci
          npm install --save-dev 'vitest@^4.1.11'
          npm update fast-uri nanoid
          npm ci
          npm ls vitest @vitest/mocker fast-uri nanoid
      - name: Require an advisory-free dependency tree
        run: |
          npm audit --json > /tmp/daily-notes-audit.json
          cat /tmp/daily-notes-audit.json
      - run: npm run check
      - run: npm test
      - run: npm run test:package-schema -- .kestral-contract/schemas/app.schema.json
      - run: npm run package:digest
      - run: npm run test:reproducible
      - name: Document dependency findings and commit validated updates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('package-lock.json').read_text())['packages']
          versions = ', '.join(f"`{name}` {lock['node_modules/' + name]['version']}" for name in ('vitest', 'fast-uri', 'nanoid'))
          path = Path('REVIEW.md')
          text = path.read_text()
          section = '\n## Dependency audit\n\nThe review-time npm audit reported four affected dependency entries (two high,\ntwo moderate): `fast-uri`, `nanoid`, `vitest`, and `@vitest/mocker`. The findings\nare in the build/test dependency tree; they do not by themselves demonstrate an\nexploitable path in the installed sandboxed app.\n\nUpdated ' + versions + '. Vitest moves to the patched 4.x line because\nthe redirect-mock advisory is not fixed on 3.x; no forced all-dependency upgrade\nor advisory suppression is used. The complete tests, package schema, and\nreproducibility gates pass with this dependency tree, and npm audit reports zero\nknown vulnerabilities at review time.\n\nAdvisories: [Vitest mocker](https://github.com/advisories/GHSA-82fw-gwwq-j7x9),\n[fast-uri](https://github.com/advisories/GHSA-5jgf-p345-68v8),\n[nanoid](https://github.com/advisories/GHSA-2v37-7h3g-55p8).\n'
          assert '\n## Boundaries\n' in text and '\n## Dependency audit\n' not in text
          path.write_text(text.replace('\n## Boundaries\n', section + '\n## Boundaries\n'))
          PY
          git add package.json package-lock.json REVIEW.md dist
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: update vulnerable build and test dependencies'
          git push origin HEAD:refs/heads/fix/deep-review-data-integrity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-notes-dependency-audit
          path: /tmp/daily-notes-audit.json
          retention-days: 1

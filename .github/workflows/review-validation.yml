name: Review validation workspace

on:
  push:
    branches: [fix/deep-review-data-integrity]
    paths: [.github/workflows/review-validation.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Package source and locked dependencies for offline validation
        run: tar --exclude=.git -czf /tmp/daily-notes-review.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: daily-notes-review-workspace
          path: /tmp/daily-notes-review.tar.gz
          retention-days: 1

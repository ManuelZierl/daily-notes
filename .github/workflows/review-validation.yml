name: Review validation workspace

on:
  push:
    branches: [fix/deep-review-data-integrity]
    paths: [.github/workflows/review-validation.yml]

permissions:
  contents: read

jobs:
  validate-and-publish:
    if: github.ref == 'refs/heads/fix/deep-review-data-integrity'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Apply the checksum-verified review patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = Path('.review/changes.patch.gz.b64').read_text().strip()
          encoded = encoded.replace('04291ez+3u3uO/Akiad', '04291ez+3uO/Akiad')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '47a73bd600ae57ce8a7bcc5b638f05cba59f7e8abe7fe8d070c46a7b00487ac0'
          Path('/tmp/daily-notes-review.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/daily-notes-review.patch
          git apply --unidiff-zero --index /tmp/daily-notes-review.patch
          git rm .review/changes.patch.gz.b64
          git diff --cached --check
      - name: Check out the pinned Kestral package contract
        uses: actions/checkout@v6
        with:
          repository: ManuelZierl/kestral
          ref: 82a983a268911e7a1958b4c6eab06dde334070b1
          path: .kestral-contract
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:package-schema -- .kestral-contract/schemas/app.schema.json
      - run: npm run package:digest
      - run: npm run test:reproducible
      - name: Commit validated source and rebuilt package to the review branch only
        run: |
          git add README.md REVIEW.md src test dist
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve edits and harden daily notes persistence and proposals'
          git push origin HEAD:refs/heads/fix/deep-review-data-integrity
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: review-patch-transfer
          path: .review/changes.patch.gz.b64
          include-hidden-files: true
          retention-days: 1
